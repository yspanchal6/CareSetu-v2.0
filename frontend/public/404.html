<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CareSetu — Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404s to index.html with the route saved in search query
      (function() {
        var pathSegmentsToKeep = 1; // '/CareSetu/' is 1 segment
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CareSetu application...</p>
  </body>
</html>
