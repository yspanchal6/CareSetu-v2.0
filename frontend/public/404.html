<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CareSetu — Redirecting...</title>
    <script>
      // Single Page Apps redirector (supports both Cloudflare Pages root and GitHub Pages /CareSetu/ subpath)
      (function() {
        var l = window.location;
        // If hosted on GitHub Pages under a subfolder like /CareSetu or /CareSetu-v2.0
        var isGitHubPagesSubpath = l.pathname.toLowerCase().indexOf('/caresetu') === 0;
        var pathSegmentsToKeep = isGitHubPagesSubpath ? 1 : 0;
        var prefix = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var rest = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          (prefix ? prefix : '') + '/?/' +
          rest +
          (l.search ? '&' + l.search.slice(1) : '') +
          l.hash;
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to CareSetu application...</p>
  </body>
</html>
